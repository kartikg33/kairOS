name: Build Kairos

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Kairos
        run: |
          chmod +x ./build.sh
          sudo ./build.sh "${{ matrix.arch }}"

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: kairos-${{ matrix.arch }}
          path: |
            output/*.iso
            output/*.sha256
          if-no-files-found: error
          retention-days: 14